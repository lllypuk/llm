name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags live ./cmd/llmcheck
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --build-tags=live
